<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examiyo — Result</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --secondary: #22C55E;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --border: #E5E7EB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --red: #DC2626;
            --orange: #F59E0B;
            --purple: #7C3AED;
            --radius: 18px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 0 60px 0;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 10px 0;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .logo-text span {
            color: var(--primary);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            padding: 4px 12px 4px 10px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .header-center .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--secondary);
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.20);
            cursor: default;
            user-select: none;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: color 0.2s;
            padding: 6px 0;
            margin-bottom: 4px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .back-link i {
            font-size: 0.85rem;
            transition: transform 0.2s;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }

        /* ===== RESULT CARD ===== */
        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .result-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 18px;
        }

        .result-title i {
            color: var(--orange);
            margin-right: 8px;
        }

        .result-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            background: var(--bg);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .result-info .info-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
        }

        .result-info .info-item:last-child {
            border-bottom: none;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            font-size: 0.9rem;
            border-radius: 12px;
            overflow: hidden;
        }

        .result-table th {
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
        }

        .result-table td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        .result-table .highlight {
            color: var(--primary);
            font-weight: 700;
        }

        .result-table .wrong {
            color: var(--red);
            font-weight: 700;
        }

        .result-status {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            margin: 6px 0 0 0;
        }

        .result-status.first-division {
            background: rgba(37, 99, 235, 0.10);
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .result-status.second-division {
            background: rgba(245, 158, 11, 0.10);
            color: #D97706;
            border: 2px solid #D97706;
        }

        .result-status.third-division {
            background: rgba(124, 58, 237, 0.10);
            color: var(--purple);
            border: 2px solid var(--purple);
        }

        .result-status.fail {
            background: rgba(220, 38, 38, 0.08);
            color: var(--red);
            border: 2px solid var(--red);
        }

        /* ===== ACTIONS ===== */
        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 8px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: #1D4ED8;
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: var(--red);
            color: white;
        }
        .btn-danger:hover {
            background: #B91C1C;
            box-shadow: var(--shadow-md);
        }

        .result-footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container { padding: 10px 12px; }
            .header-inner { padding: 0 12px; }
            .logo-text { font-size: 16px; }
            .logo-icon { width: 28px; height: 28px; font-size: 14px; }
            .header-center { font-size: 10px; padding: 3px 10px 3px 8px; }
            .header-avatar { width: 30px; height: 30px; font-size: 12px; }

            .result-card { padding: 18px 16px; }
            .result-title { font-size: 1.2rem; margin-bottom: 14px; }
            .result-info { grid-template-columns: 1fr; padding: 12px 14px; font-size: 0.85rem; }
            .result-table { font-size: 0.82rem; }
            .result-table th, .result-table td { padding: 8px 10px; }
            .result-status { font-size: 1rem; padding: 12px; }

            .btn { padding: 8px 14px; font-size: 0.8rem; }
            .result-actions { gap: 8px; }
        }

        @media (max-width: 400px) {
            .result-card { padding: 14px 12px; }
            .result-title { font-size: 1rem; }
            .result-table { font-size: 0.78rem; }
            .result-table th, .result-table td { padding: 6px 8px; }
            .btn { padding: 7px 12px; font-size: 0.75rem; }
        }

        @media print {
            body * { visibility: hidden; }
            .result-card, .result-card * { visibility: visible; }
            .result-card { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
            .result-actions, .result-footer, .back-link, .header { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">E</span>
                <span class="logo-text">Exami<span>yo</span></span>
            </a>
            <div class="header-center">
                <span class="badge-dot"></span>
                UP Board Class 10
            </div>
            <div class="header-avatar">K</div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">

        <!-- Back Link -->
        <a href="chapter-list.html" class="back-link" id="backLink">
            <i class="fas fa-arrow-left"></i> Back to Chapters
        </a>

        <!-- Result Card -->
        <div class="result-card" id="resultCard">
            <div class="result-title">
                <i class="fas fa-award"></i> Test Result
            </div>

            <div class="result-info">
                <div class="info-item"><strong>Test:</strong> <span id="rChapter">-</span></div>
                <div class="info-item"><strong>Subject:</strong> <span id="rSubject">-</span></div>
                <div class="info-item"><strong>Date:</strong> <span id="rDate">-</span></div>
                <div class="info-item"><strong>Result ID:</strong> <span id="rId">-</span></div>
            </div>

            <table class="result-table">
                <thead><tr><th>Parameter</th><th>Value</th></tr></thead>
                <tbody>
                    <tr><td>Total Questions</td><td id="rTotal">0</td></tr>
                    <tr><td>Attempted</td><td id="rAttempted">0</td></tr>
                    <tr><td>Correct Answers</td><td id="rCorrect" class="highlight">0</td></tr>
                    <tr><td>Wrong Answers</td><td id="rWrong" class="wrong">0</td></tr>
                    <tr><td>Total Marks</td><td id="rTotalMarks">0</td></tr>
                    <tr><td>Marks Obtained</td><td id="rObtained" class="highlight">0</td></tr>
                    <tr><td>Percentage</td><td id="rPercentage" class="highlight">0%</td></tr>
                </tbody>
            </table>

            <div class="result-status" id="rStatus">-</div>
        </div>

        <!-- Actions -->
        <div class="result-actions">
            <button id="downloadPDF" class="btn btn-primary">
                <i class="fas fa-download"></i> Download PDF
            </button>
            <button id="printResult" class="btn btn-secondary">
                <i class="fas fa-print"></i> Print
            </button>
            <button id="newTest" class="btn btn-danger">
                <i class="fas fa-arrow-left"></i> Back to Chapters
            </button>
        </div>

        <div class="result-footer">
            <p>Examiyo — MCQ Practice Platform</p>
        </div>

    </main>

    <script>
        // ============================================================
        // READ URL PARAMS
        // ============================================================
        function getResultData() {
            const params = new URLSearchParams(window.location.search);
            return {
                chapter: params.get('chapter') || 'Chapter Test',
                subject: params.get('subject') || 'English',
                total: parseInt(params.get('total')) || 0,
                attempted: parseInt(params.get('attempted')) || 0,
                correct: parseInt(params.get('correct')) || 0,
                wrong: parseInt(params.get('wrong')) || 0,
                totalMarks: parseInt(params.get('totalMarks')) || 0,
                obtained: parseFloat(params.get('obtained')) || 0,
                percentage: parseFloat(params.get('percentage')) || 0,
                division: params.get('division') || 'FAIL',
                statusClass: params.get('statusClass') || 'fail',
                resultId: params.get('resultId') || 'EXM-' + Date.now(),
                date: params.get('date') || new Date().toLocaleDateString('en-IN')
            };
        }

        // ============================================================
        // DISPLAY RESULT
        // ============================================================
        function displayResult() {
            const data = getResultData();

            document.getElementById('rChapter').textContent = data.chapter;
            document.getElementById('rSubject').textContent = data.subject;
            document.getElementById('rDate').textContent = data.date;
            document.getElementById('rId').textContent = data.resultId;

            document.getElementById('rTotal').textContent = data.total;
            document.getElementById('rAttempted').textContent = data.attempted;
            document.getElementById('rCorrect').textContent = data.correct;
            document.getElementById('rWrong').textContent = data.wrong;
            document.getElementById('rTotalMarks').textContent = data.totalMarks;
            document.getElementById('rObtained').textContent = data.obtained;
            document.getElementById('rPercentage').textContent = data.percentage + '%';

            const statusEl = document.getElementById('rStatus');
            statusEl.className = `result-status ${data.statusClass}`;
            statusEl.textContent = data.division === 'FAIL' ? '❌ FAIL' : `🏆 ${data.division}`;

            // Back link
            const backLink = document.getElementById('backLink');
            backLink.href = `chapter-list.html?subject=${encodeURIComponent(data.subject)}`;

            // New test button
            document.getElementById('newTest').addEventListener('click', function() {
                window.location.href = backLink.href;
            });
        }

        // ============================================================
        // PRINT
        // ============================================================
        document.getElementById('printResult').addEventListener('click', function() {
            window.print();
        });

        // ============================================================
        // DOWNLOAD PDF
        // ============================================================
        document.getElementById('downloadPDF').addEventListener('click', async function() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const card = document.getElementById('resultCard');

            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            this.disabled = true;

            try {
                const clone = card.cloneNode(true);
                clone.style.width = '700px';
                clone.style.padding = '30px';
                clone.style.border = '2px solid #2563EB';
                clone.style.borderRadius = '18px';
                clone.style.background = 'white';
                clone.style.position = 'fixed';
                clone.style.left = '-10000px';
                clone.style.top = '0';
                clone.style.zIndex = '-1000';
                document.body.appendChild(clone);

                const canvas = await html2canvas(clone, {
                    scale: 2,
                    backgroundColor: '#FFFFFF',
                    useCORS: true,
                    logging: false,
                    width: 700
                });

                document.body.removeChild(clone);

                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 190;
                const pageHeight = 277;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                if (imgHeight > pageHeight) {
                    const scale = pageHeight / imgHeight;
                    const sw = imgWidth * scale * 0.95;
                    const sh = imgHeight * scale * 0.95;
                    pdf.addImage(imgData, 'PNG', (210 - sw) / 2, (297 - sh) / 2, sw, sh);
                } else {
                    pdf.addImage(imgData, 'PNG', 10, (pageHeight - imgHeight) / 2, imgWidth, imgHeight);
                }

                const resultId = document.getElementById('rId').textContent;
                pdf.setFontSize(10);
                pdf.setTextColor(100, 100, 100);
                pdf.text(`Result ID: ${resultId} | Generated: ${new Date().toLocaleDateString()}`, 105, 287, { align: 'center' });

                pdf.save(`Examiyo_Result_${resultId}.pdf`);

            } catch (err) {
                console.error('PDF error:', err);
                alert('Error generating PDF. Please use Print instead.');
            }

            this.innerHTML = '<i class="fas fa-download"></i> Download PDF';
            this.disabled = false;
        });

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', displayResult);
    </script>
</body>
</html>
