<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examiyo — Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --secondary: #22C55E;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --border: #E5E7EB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --red: #DC2626;
            --orange: #F59E0B;
            --radius: 18px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 0 80px 0;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 12px 16px;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 10px 0;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .logo-text span {
            color: var(--primary);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg);
            padding: 4px 12px 4px 10px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .header-center .badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--secondary);
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.20);
            cursor: default;
            user-select: none;
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: color 0.2s;
            padding: 6px 0;
            margin-bottom: 4px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .back-link i {
            font-size: 0.85rem;
            transition: transform 0.2s;
        }

        .back-link:hover i {
            transform: translateX(-3px);
        }

        /* ===== TEST HEADER ===== */
        .test-header {
            background: var(--card-bg);
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .test-header .test-info {
            flex: 1;
            min-width: 140px;
        }

        .test-header .test-info .test-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .test-header .test-info .test-subject {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .timer-container {
            background: var(--red);
            color: white;
            padding: 6px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .timer-container.warning {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ===== QUESTION NAV ===== */
        .question-nav {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .question-nav .jump-to {
            flex: 1;
            min-width: 120px;
        }

        .question-nav .jump-to label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 3px;
        }

        .question-nav .jump-to select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .question-nav .jump-to select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .question-nav .status-indicators {
            display: flex;
            gap: 14px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .question-nav .status-indicators .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            vertical-align: middle;
        }

        .dot-answered { background: var(--primary); }
        .dot-unanswered { background: var(--border); }

        /* ===== QUESTION ===== */
        .question-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            min-height: 260px;
        }

        .question-number {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--card-bg);
            -webkit-tap-highlight-color: transparent;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.04);
        }

        .option.selected {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }

        .option input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.1);
            flex-shrink: 0;
            accent-color: var(--primary);
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .option-label {
            font-weight: 600;
            color: var(--primary);
            margin-right: 8px;
            min-width: 20px;
            font-size: 0.9rem;
        }

        .option-text {
            flex: 1;
            font-size: 0.92rem;
        }

        .question-progress {
            text-align: center;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 8px 0 4px 0;
        }

        /* ===== NAV ROW ===== */
        .nav-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .nav-row .btn {
            flex: 1;
            min-width: 70px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 6px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: #1D4ED8;
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-warning {
            background: var(--orange);
            color: white;
        }
        .btn-warning:hover {
            background: #D97706;
            box-shadow: var(--shadow-md);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== SUBMISSION OVERLAY ===== */
        .submission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .submission-overlay.active {
            display: flex;
        }

        .submission-content {
            background: var(--card-bg);
            padding: 32px 36px;
            border-radius: var(--radius);
            text-align: center;
            max-width: 320px;
            box-shadow: var(--shadow-lg);
        }

        .submission-content .spinner {
            font-size: 2.8rem;
            color: var(--primary);
            animation: spin 1.2s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .submission-content h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .submission-content p {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container { padding: 10px 12px; }
            
            .header-inner { padding: 0 12px; }
            .logo-text { font-size: 16px; }
            .logo-icon { width: 28px; height: 28px; font-size: 14px; }
            .header-center { font-size: 10px; padding: 3px 10px 3px 8px; }
            .header-avatar { width: 30px; height: 30px; font-size: 12px; }

            .test-header { padding: 12px 14px; }
            .test-header .test-info .test-name { font-size: 0.95rem; }
            .timer-container { font-size: 1rem; padding: 5px 12px; min-width: 70px; }

            .question-container { padding: 14px 16px; min-height: 200px; }
            .question-text { font-size: 0.95rem; margin-bottom: 16px; }
            .option { padding: 8px 12px; font-size: 0.88rem; }
            .option input[type="radio"] { transform: scale(1); width: 14px; height: 14px; }
            .option-label { font-size: 0.85rem; min-width: 18px; }

            .question-nav { padding: 10px 14px; }
            .question-nav .jump-to { min-width: 100px; }
            .question-nav .jump-to select { font-size: 0.8rem; padding: 5px 8px; }

            .nav-row { gap: 8px; }
            .nav-row .btn { padding: 8px 12px; font-size: 0.8rem; min-width: 60px; }

            .submission-content { padding: 24px 28px; max-width: 280px; }
            .submission-content .spinner { font-size: 2.4rem; }
        }

        @media (max-width: 400px) {
            .container { padding: 8px 10px; }
            .test-header .test-info .test-name { font-size: 0.9rem; }
            .question-container { padding: 12px 14px; min-height: 180px; }
            .question-text { font-size: 0.9rem; }
            .option { padding: 7px 10px; font-size: 0.85rem; }
            .nav-row .btn { padding: 7px 8px; font-size: 0.75rem; min-width: 50px; }
            .timer-container { font-size: 0.9rem; padding: 4px 10px; min-width: 60px; }
        }

        @media (max-height: 700px) {
            .question-container { min-height: 160px; padding: 12px 14px; }
            .question-text { margin-bottom: 12px; font-size: 0.95rem; }
            .option { padding: 6px 10px; }
            .test-header { padding: 10px 14px; margin-bottom: 8px; }
            .question-nav { padding: 8px 14px; margin-bottom: 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">E</span>
                <span class="logo-text">Exami<span>yo</span></span>
            </a>
            <div class="header-center">
                <span class="badge-dot"></span>
                UP Board Class 10
            </div>
            <div class="header-avatar">K</div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">

        <!-- Back Link -->
        <a href="chapter-list.html?subject=English" class="back-link" id="backLink">
            <i class="fas fa-arrow-left"></i> Back to Chapters
        </a>

        <!-- Test Header -->
        <div class="test-header">
            <div class="test-info">
                <div class="test-name" id="testName">Chapter Test</div>
                <div class="test-subject" id="testSubject">📖 Subject: English</div>
            </div>
            <div class="timer-container" id="timer">10:00</div>
        </div>

        <!-- Question Nav -->
        <div class="question-nav">
            <div class="jump-to">
                <label>Jump to:</label>
                <select id="jumpSelect">
                    <!-- populated dynamically -->
                </select>
            </div>
            <div class="status-indicators">
                <span><span class="dot dot-answered"></span> Done</span>
                <span><span class="dot dot-unanswered"></span> Pending</span>
            </div>
        </div>

        <div class="question-progress" id="questionProgress">Question 1 of 5</div>

        <!-- Question -->
        <div class="question-container">
            <div class="question-number" id="questionNumber">Q1.</div>
            <div class="question-text" id="questionText">Loading question...</div>
            <div class="options-container" id="optionsContainer">
                <!-- Options loaded dynamically -->
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-row">
            <button id="prevBtn" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Prev
            </button>
            <button id="submitBtn" class="btn btn-warning">
                <i class="fas fa-paper-plane"></i> Submit
            </button>
            <button id="nextBtn" class="btn btn-primary">
                Next <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- ===== SUBMISSION OVERLAY ===== -->
    <div class="submission-overlay" id="submissionOverlay">
        <div class="submission-content">
            <div class="spinner"><i class="fas fa-spinner"></i></div>
            <h3>Submitting Test...</h3>
            <p>Please wait while we process your answers.</p>
        </div>
    </div>

    <script>
        // ============================================================
        // DEMO QUESTIONS
        // ============================================================
        const DEMO_QUESTIONS = [
            {
                text: "What is the capital of France?",
                options: ["London", "Paris", "Berlin", "Madrid"],
                correctAnswer: "B"
            },
            {
                text: "Which planet is known as the Red Planet?",
                options: ["Venus", "Jupiter", "Mars", "Saturn"],
                correctAnswer: "C"
            },
            {
                text: "What is 7 × 8?",
                options: ["48", "56", "64", "72"],
                correctAnswer: "B"
            },
            {
                text: "Who wrote 'Hamlet'?",
                options: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Jane Austen"],
                correctAnswer: "B"
            },
            {
                text: "What is the chemical symbol for water?",
                options: ["H2O", "CO2", "NaCl", "HCl"],
                correctAnswer: "A"
            }
        ];

        // ============================================================
        // STATE
        // ============================================================
        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let timerInterval = null;
        let timeRemaining = 0;
        let isSubmitting = false;
        let chapterName = '';
        let subjectName = '';

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const testName = $('testName');
        const testSubject = $('testSubject');
        const timerEl = $('timer');
        const jumpSelect = $('jumpSelect');
        const progressEl = $('questionProgress');
        const qNum = $('questionNumber');
        const qText = $('questionText');
        const optionsContainer = $('optionsContainer');
        const prevBtn = $('prevBtn');
        const nextBtn = $('nextBtn');
        const submitBtn = $('submitBtn');
        const overlay = $('submissionOverlay');
        const backLink = $('backLink');

        // ============================================================
        // URL PARAMS
        // ============================================================
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            chapterName = params.get('chapter') || 'Chapter Test';
            subjectName = params.get('subject') || 'English';
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            getParams();
            questions = DEMO_QUESTIONS;
            answers = {};
            currentIndex = 0;

            // Update UI
            testName.textContent = chapterName;
            testSubject.textContent = `📖 ${subjectName}`;
            backLink.href = `chapter-list.html?subject=${encodeURIComponent(subjectName)}`;

            // Timer: 10 minutes
            timeRemaining = 10 * 60;
            startTimer();

            // Build jump dropdown
            jumpSelect.innerHTML = '';
            questions.forEach((_, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Q${i+1}`;
                jumpSelect.appendChild(opt);
            });
            jumpSelect.addEventListener('change', function() {
                showQuestion(parseInt(this.value));
            });

            showQuestion(0);
        }

        // ============================================================
        // SHOW QUESTION
        // ============================================================
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;

            currentIndex = index;
            const q = questions[index];

            progressEl.textContent = `Question ${index+1} of ${questions.length}`;
            qNum.textContent = `Q${index+1}.`;
            qText.textContent = q.text;
            jumpSelect.value = index;

            const labels = ['A', 'B', 'C', 'D'];
            const selected = answers[index] || null;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = `option ${selected === labels[i] ? 'selected' : ''}`;
                div.innerHTML = `
                    <input type="radio" name="question" value="${labels[i]}" ${selected === labels[i] ? 'checked' : ''}>
                    <span class="option-label">${labels[i]})</span>
                    <span class="option-text">${opt}</span>
                `;
                div.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;
                    selectOption(index, labels[i]);
                });
                optionsContainer.appendChild(div);
            });

            // Sync radio changes
            optionsContainer.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    if (this.checked) selectOption(index, this.value);
                });
            });

            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;
        }

        // ============================================================
        // SELECT OPTION
        // ============================================================
        function selectOption(qIndex, value) {
            answers[qIndex] = value;
            showQuestion(qIndex);
        }

        // ============================================================
        // TIMER
        // ============================================================
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimer();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimer();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitTest();
                }

                if (timeRemaining <= 60) timerEl.classList.add('warning');
            }, 1000);
        }

        function updateTimer() {
            const m = Math.floor(timeRemaining / 60);
            const s = timeRemaining % 60;
            timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) showQuestion(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
        });

        submitBtn.addEventListener('click', () => {
            if (isSubmitting) return;
            if (confirm('Submit your test?')) submitTest();
        });

        // ============================================================
        // SUBMIT → Redirect to result.html
        // ============================================================
        function submitTest() {
            if (isSubmitting) return;
            isSubmitting = true;

            overlay.classList.add('active');
            if (timerInterval) clearInterval(timerInterval);

            setTimeout(() => {
                try {
                    // Calculate results
                    const total = questions.length;
                    let attempted = 0, correct = 0;

                    for (let i = 0; i < total; i++) {
                        if (answers[i]) {
                            attempted++;
                            if (answers[i] === questions[i].correctAnswer) correct++;
                        }
                    }

                    const wrong = attempted - correct;
                    const percentage = (correct / total) * 100;

                    let division, statusClass;
                    if (percentage >= 60) { division = 'FIRST DIVISION'; statusClass = 'first-division'; }
                    else if (percentage >= 45) { division = 'SECOND DIVISION'; statusClass = 'second-division'; }
                    else if (percentage >= 33) { division = 'THIRD DIVISION'; statusClass = 'third-division'; }
                    else { division = 'FAIL'; statusClass = 'fail'; }

                    const resultId = 'EXM' + Date.now() + String(Math.floor(Math.random() * 1000)).padStart(3, '0');

                    // Build result data as URL params
                    const params = new URLSearchParams({
                        chapter: chapterName,
                        subject: subjectName,
                        total: total,
                        attempted: attempted,
                        correct: correct,
                        wrong: wrong,
                        totalMarks: total,
                        obtained: correct,
                        percentage: percentage.toFixed(1),
                        division: division,
                        statusClass: statusClass,
                        resultId: resultId,
                        date: new Date().toLocaleDateString('en-IN')
                    });

                    overlay.classList.remove('active');
                    isSubmitting = false;

                    // Redirect to result page
                    window.location.href = `result.html?${params.toString()}`;

                } catch (err) {
                    console.error('Submit error:', err);
                    overlay.classList.remove('active');
                    alert('Error submitting test. Please try again.');
                    isSubmitting = false;
                }
            }, 1000);
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
            else if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
            else if (e.key >= '1' && e.key <= '4') {
                const radios = document.querySelectorAll('#optionsContainer input[type="radio"]');
                if (radios[e.key - 1]) radios[e.key - 1].click();
            }
        });

        // ============================================================
        // START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
